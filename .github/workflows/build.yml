name: Build and Publish

# Builds the sample-stateful image and pushes it to Docker Hub
# (docker.io/calliopeai/astrolift-sample-stateful). Mirrors the
# astrolift-agents build-images.yml login + tag pattern: org-level secrets
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (visibility=ALL), deterministic
# main-<sha7> tag for deploys plus a moving :latest. Push only on main; PRs
# build to verify the Dockerfile but do not publish.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch:

env:
  REGISTRY_DOCKERHUB: docker.io
  NAMESPACE: calliopeai
  IMAGE: astrolift-sample-stateful

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          echo "sha=main-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >>"$GITHUB_OUTPUT"
          else
            echo "push=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg "GIT_SHA=${{ steps.tags.outputs.sha }}" \
            --build-arg "BUILD_IMAGE=${REGISTRY_DOCKERHUB}/${NAMESPACE}/${IMAGE}:${{ steps.tags.outputs.sha }}" \
            --build-arg "BUILT_AT=${{ steps.tags.outputs.built_at }}" \
            -t "${REGISTRY_DOCKERHUB}/${NAMESPACE}/${IMAGE}:${{ steps.tags.outputs.sha }}" \
            -t "${REGISTRY_DOCKERHUB}/${NAMESPACE}/${IMAGE}:latest" \
            .

      - name: Push tags (Docker Hub)
        if: steps.tags.outputs.push == 'true'
        run: |
          docker push "${REGISTRY_DOCKERHUB}/${NAMESPACE}/${IMAGE}:${{ steps.tags.outputs.sha }}"
          docker push "${REGISTRY_DOCKERHUB}/${NAMESPACE}/${IMAGE}:latest"
